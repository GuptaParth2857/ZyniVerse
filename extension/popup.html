<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZyniVerse Auto-Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      padding: 16px;
      background: #0a0a0f;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .logo {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, #d946ef, #22d3ee);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 12px; color: #000;
    }
    h1 { font-size: 15px; font-weight: 700; }
    .sub { color: #8b8b94; font-size: 11px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #b3b3bc; margin: 12px 0 6px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 8px 10px; border-radius: 8px;
      background: #15151d; border: 1px solid #2a2a35; color: #fff; font-size: 12px; outline: none;
    }
    input:focus { border-color: #d946ef; }
    .status { margin-top: 12px; font-size: 12px; border-radius: 8px; padding: 9px 10px; line-height: 1.4; }
    .status.good { background: rgba(16, 185, 129, 0.12); color: #34d399; }
    .status.bad { background: rgba(244, 63, 94, 0.12); color: #fb7185; }
    .status.info { background: rgba(34, 211, 238, 0.1); color: #22d3ee; }
    button {
      width: 100%; margin-top: 12px; padding: 9px; border: none; border-radius: 8px;
      background: linear-gradient(135deg, #d946ef, #22d3ee); color: #000;
      font-weight: 700; font-size: 12px; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .switch { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    .switch span { font-size: 12px; color: #b3b3bc; }
    input[type="checkbox"] { accent-color: #d946ef; width: 16px; height: 16px; }
    .foot { margin-top: 14px; font-size: 10px; color: #6b6b74; text-align: center; }
    a { color: #22d3ee; text-decoration: none; }
    .recent { margin-top: 12px; font-size: 11px; color: #8b8b94; }
    .recent div { margin-top: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">ZV</div>
    <div>
      <h1>ZyniVerse Auto-Tracker</h1>
      <div class="sub">Watch → auto-sync to your list</div>
    </div>
  </div>

  <label for="key">ZyniVerse API Key</label>
  <input type="password" id="key" placeholder="zvn_..." autocomplete="off" />

  <div class="switch">
    <span>Auto-sync episodes</span>
    <input type="checkbox" id="enabled" checked />
  </div>

  <div id="status" class="status info">Loading…</div>
  <button id="save">Save &amp; Verify</button>

  <div class="recent" id="recent"></div>
  <div class="foot">
    Get a free key at <a href="https://zyverse.in/profile" target="_blank">zyverse.in/profile</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
