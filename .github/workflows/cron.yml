name: ZyniVerse crons

# Vercel Hobby allows only 2 cron jobs, each running at most once per day, so
# the 8 schedules this app needs could not live in vercel.json (a Hobby deploy
# with more than 2 crons fails config validation outright). GitHub Actions has
# no per-job count or frequency limit, so the same schedules run here instead.
#
# The /api/cron/* routes authenticate with `Authorization: Bearer $CRON_SECRET`.
#
# Vercel Hobby caps a function at 60s, so the heavier jobs (refresh-schedules,
# analytics, character-tournaments) are chunked: each invocation reports a
# `nextQuery` to resume with, and this workflow keeps calling until the job
# reports `nextQuery: null`. Jobs that fit in one call just return `null`.
#
# Required repo settings (Settings -> Secrets and variables -> Actions):
#   - secret  CRON_SECRET      must match the value in Vercel's env vars
#   - variable BASE_URL        e.g. https://zyverse.in
#
# Note: schedules are UTC, and GitHub queues them during peak load, so a run
# can land up to ~15 minutes late — sometimes hours. These jobs are daily/weekly
# monthly batch jobs, so that drift is harmless: the job is picked from
# `github.event.schedule` (the cron expression that triggered the run), never
# from the wall-clock hour at run time.

on:
  schedule:
    - cron: "0 9 * * *" # character-tournaments (daily)
    - cron: "0 3 * * 0" # db-prune (Sunday)
    - cron: "0 5 * * 1" # event-alerts (Monday)
    - cron: "0 8 * * 1" # indexnow (Monday)
    - cron: "0 0 1 * *" # refresh-schedules (1st, 00:00)
    - cron: "0 2 1 * *" # refresh-awards (1st, 02:00)
    - cron: "0 4 1 * *" # refresh-posters (1st, 04:00)
    - cron: "0 6 1 * *" # analytics (1st, 06:00)
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Run a single endpoint instead of the scheduled set (e.g. db-prune)"
        required: false

permissions:
  contents: read

concurrency:
  group: zyniverse-crons
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Work out which endpoints are due
        id: due
        env:
          MANUAL: ${{ inputs.endpoint }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          if [ -n "${MANUAL:-}" ]; then
            echo "list=${MANUAL}" >> "$GITHUB_OUTPUT"
            echo "Manual run: ${MANUAL}"
            exit 0
          fi

          # `github.event.schedule` holds the cron expression that triggered
          # this run. It is the ONLY reliable way to know which job is due.
          #
          # The previous version derived the job from the wall-clock hour
          # (case "$HOUR"). GitHub queues scheduled workflows during peak load
          # and can start them hours late — observed runs: "0 3 * * 0"
          # (db-prune) starting at 12:55 UTC, "0 9 * * *" starting at 14:17 UTC.
          # Every one of those runs resolved to "<nothing>" and no cron ever
          # fired, so the database was never pruned (7.4 MB/day of growth) and
          # the daily analytics snapshot stopped on 2026-10-16.
          #
          # Mapping the schedule string instead is delay-proof: a late run
          # still executes the job it was scheduled for.
          SCHEDULE_NORM="$(printf '%s' "${SCHEDULE:-}" | tr -s '[:space:]' ' ' | sed -e 's/^ //' -e 's/ $//')"

          LIST=""
          case "$SCHEDULE_NORM" in
            "0 9 * * *") LIST="character-tournaments" ;;
            "0 3 * * 0") LIST="db-prune" ;;
            "0 5 * * 1") LIST="event-alerts" ;;
            "0 8 * * 1") LIST="indexnow" ;;
            "0 0 1 * *") LIST="refresh-schedules" ;;
            "0 2 1 * *") LIST="refresh-awards" ;;
            "0 4 1 * *") LIST="refresh-posters" ;;
            "0 6 1 * *") LIST="analytics" ;;
            "")           LIST="__manual__" ;;
            *)            LIST="" ;;
          esac

          if [ "$LIST" = "__manual__" ]; then
            # Reached only when the workflow was started without a schedule
            # context and without an explicit endpoint: fall back to the
            # time-based routing so a manual run still does something.
            DOW=$(date -u +%w)   # 0 = Sunday
            DOM=$(date -u +%d)   # 01-31
            HOUR=$(date -u +%H)
            case "$HOUR" in
              00) [ "$DOM" = "01" ] && LIST="refresh-schedules" ;;
              02) [ "$DOM" = "01" ] && LIST="refresh-awards" ;;
              03) [ "$DOW" = "0" ]  && LIST="db-prune" ;;
              04) [ "$DOM" = "01" ] && LIST="refresh-posters" ;;
              05) [ "$DOW" = "1" ]  && LIST="event-alerts" ;;
              06) [ "$DOM" = "01" ] && LIST="analytics" ;;
              08) [ "$DOW" = "1" ]  && LIST="indexnow" ;;
              09) LIST="character-tournaments" ;;
              *)  LIST="" ;;
            esac
            echo "No schedule context — fell back to time routing at UTC $(date -u)"
          fi

          echo "list=${LIST}" >> "$GITHUB_OUTPUT"
          echo "schedule='${SCHEDULE_NORM}' -> due: ${LIST:-<nothing>}"

          if [ -z "$LIST" ]; then
            echo "::warning::No endpoint mapped for schedule '${SCHEDULE_NORM}' — nothing ran"
          fi

      - name: Hit cron endpoints
        if: steps.due.outputs.list != ''
        env:
          BASE: ${{ vars.BASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
          LIST: ${{ steps.due.outputs.list }}
        run: |
          set -uo pipefail
          if [ -z "${BASE:-}" ] || [ -z "${SECRET:-}" ]; then
            echo "::error::BASE_URL variable or CRON_SECRET secret is missing"
            exit 1
          fi

          failed=0
          for name in $LIST; do
            # Long jobs are chunked: every response carries a `nextQuery` (raw
            # query string, no leading "?") that resumes where the previous
            # invocation stopped, because one unbounded call would blow Vercel's
            # 60s function cap. `null` means the job is done.
            query=""
            for chunk in $(seq 1 30); do
              code=$(curl -sS -o "/tmp/${name}.out" -w '%{http_code}' --max-time 540 \
                -H "Authorization: Bearer ${SECRET}" \
                "${BASE%/}/api/cron/${name}${query}" || echo "000")
              echo "${name}${query:+ [${query}]} -> ${code}"
              if [ "$code" != "200" ]; then
                failed=1
                echo "::error::${name} returned ${code}"
                head -c 2000 "/tmp/${name}.out" || true
                echo
                break
              fi
              next=$(jq -r '.nextQuery // empty' "/tmp/${name}.out" 2>/dev/null || true)
              if [ -z "$next" ]; then
                break
              fi
              query="?${next}"
            done
          done
          exit $failed
